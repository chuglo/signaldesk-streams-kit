[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signaldesk-streams-kit"
version = "0.1.0"
description = "Strict Redis Streams primitives for SignalDesk consumers"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "redis>=5.2,<7",
  "pydantic>=2.11,<3",
  "signaldesk-contracts==0.2.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.uv.sources]
signaldesk-contracts = { path = "../signaldesk-contracts" }

[tool.hatch.build.targets.wheel]
packages = ["src/signaldesk_streams_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
